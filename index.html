<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#010203">
<title>LoveSuSu</title>

<style>
:root {
--bg: #010203;
--text: #c4eaf0;
--muted: #73979e;
--cyan: #b9f4ff;
--danger: #e6a3a3;
--love: #ffd0e6;
}

* { box-sizing: border-box; }

html, body {
margin: 0;
width: 100%;
min-height: 100%;
background: var(--bg);
}

body {
min-height: 100vh;
min-height: 100dvh;
padding:
max(4px, env(safe-area-inset-top))
max(4px, env(safe-area-inset-right))
max(4px, env(safe-area-inset-bottom))
max(4px, env(safe-area-inset-left));
overflow: hidden;
color: var(--text);
font-family: Consolas, "Cascadia Mono", "Microsoft JhengHei", "PingFang TC", monospace;
}

.screen {
position: relative;
display: flex;
flex-direction: column;
width: 100%;
min-height: calc(100vh - 8px);
min-height: calc(100dvh - 8px);
overflow: hidden;
border: 1px solid #22282b;
border-radius: 9px;
background:
radial-gradient(circle at center, rgba(60, 110, 200, 0.10), transparent 40%),
#010203;
}

.screen::before {
content: "";
position: absolute;
inset: 0;
z-index: 30;
pointer-events: none;
background: repeating-linear-gradient(
to bottom,
transparent 0,
transparent 3px,
rgba(177, 239, 250, 0.02) 4px
);
}

/* ── top bar ── */
.status, .counter, .credit {
position: absolute;
z-index: 5;
margin: 0;
letter-spacing: 0.09em;
}

.status {
top: 16px;
left: 14px;
font-size: 11px;
color: #bfeff4;
text-shadow: 0 0 5px rgba(183, 243, 255, 0.85), 0 0 12px rgba(120, 222, 240, 0.4);
}

.credit {
top: 37px;
left: 14px;
font-size: 10px;
color: #7fa5ac;
text-shadow: 0 0 6px rgba(128, 220, 237, 0.24);
}

.counter {
top: 16px;
right: 14px;
font-size: 11px;
color: var(--muted);
}

/* ── center stage ── */
.center {
position: relative;
z-index: 2;
flex: 1 0 auto;
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
padding: 80px 12px 24px;
}

/* logo intro */
.intro {
position: absolute;
inset: 0;
z-index: 10;
display: grid;
place-items: center;
pointer-events: none;
}

.logo-wrap {
position: relative;
display: grid;
width: 240px;
height: 260px;
place-items: center;
opacity: 0;
transform: scale(0.94);
filter: blur(6px);
}

.logo-wrap.show {
animation: logoInOut 4.6s ease-in-out forwards;
}

.logo-glow {
position: absolute;
inset: 40px;
border-radius: 50%;
background: rgba(120, 170, 255, 0.22);
filter: blur(30px);
animation: glowPulse 2.6s ease-in-out infinite;
}

.logo {
position: relative;
z-index: 2;
width: 190px;
height: auto;
user-select: none;
-webkit-user-drag: none;
filter:
drop-shadow(0 0 6px rgba(220, 235, 255, 0.9))
drop-shadow(0 0 18px rgba(120, 170, 255, 0.7))
drop-shadow(0 0 34px rgba(110, 200, 255, 0.45));
}

.tap-hint {
position: absolute;
bottom: 22%;
left: 0;
right: 0;
text-align: center;
font-size: 11px;
letter-spacing: 0.3em;
color: #5f8188;
opacity: 0;
transition: opacity 0.6s ease;
}

.gate {
position: absolute;
left: 50%;
top: 50%;
transform: translate(-50%, -50%);
pointer-events: auto;
padding: 14px 26px;
border: 1px solid #17333a;
border-radius: 4px;
background: linear-gradient(180deg, #10191c, #050a0c);
color: #c6edf4;
font: inherit;
font-size: 16px;
letter-spacing: 0.14em;
cursor: pointer;
box-shadow: 0 0 8px rgba(175, 239, 255, 0.35), 0 0 25px rgba(144, 228, 247, 0.32), 0 0 55px rgba(111, 207, 229, 0.18);
animation: blinkSoft 2s ease-in-out infinite;
transition: opacity 0.4s ease;
}

.gate.gone { opacity: 0; pointer-events: none; animation: none; }

.tap-hint.show { opacity: 1; animation: blinkSoft 1.8s ease-in-out infinite; }

/* terminal */
.terminal {
width: min(720px, 92vw);
min-height: 260px;
max-height: 62dvh;
overflow-y: auto;
padding: 16px 18px 18px;
border: 1px solid rgba(155, 233, 248, 0.24);
border-radius: 4px;
background: rgba(1, 7, 9, 0.78);
color: var(--cyan);
font-size: 14px;
line-height: 1.75;
word-break: break-word;
box-shadow:
inset 0 0 22px rgba(94, 200, 223, 0.05),
0 0 22px rgba(94, 200, 223, 0.08);
opacity: 0;
transform: translateY(10px);
transition: opacity 0.4s ease, transform 0.4s ease;
scrollbar-width: thin;
scrollbar-color: #1d3a41 transparent;
}

.terminal.visible { opacity: 1; transform: translateY(0); }
.terminal.decoding { animation: decodeFlicker 0.11s steps(2) infinite; }
.terminal.shake { animation: shake 0.38s ease; }

.terminal-head {
display: flex;
justify-content: space-between;
margin: -4px 0 10px;
padding-bottom: 8px;
border-bottom: 1px dashed rgba(155, 233, 248, 0.16);
font-size: 11px;
color: #5f8188;
letter-spacing: 0.08em;
}

.line { display: block; min-height: 1.75em; white-space: pre-wrap; }
.line.dim { color: #6f959c; }
.line.ok { color: #c9ffe9; text-shadow: 0 0 8px rgba(140, 255, 210, 0.35); }
.line.bad { color: var(--danger); text-shadow: 0 0 8px rgba(226, 155, 155, 0.35); }
.line.hint { color: #e9d8a6; }

.prompt-row {
display: flex;
align-items: center;
flex-wrap: wrap;
gap: 0 6px;
}

.prompt-label { color: #9fe9ff; white-space: nowrap; }
.prompt-label b { color: #d9f7ff; font-weight: 600; }

.pw-field {
position: relative;
flex: 1 1 140px;
min-width: 120px;
display: flex;
align-items: center;
}

.pw-input {
width: 100%;
padding: 2px 0;
border: 0;
border-bottom: 1px solid rgba(155, 233, 248, 0.25);
outline: none;
background: transparent;
color: #e6fbff;
font: inherit;
font-size: 16px; /* 防止 iOS 自動放大 */
letter-spacing: 0.25em;
caret-color: #d4fbff;
}

.pw-input:focus { border-bottom-color: rgba(185, 244, 255, 0.7); box-shadow: 0 6px 12px -10px rgba(157, 238, 255, 0.8); }
.pw-input:disabled { opacity: 0.5; }

.enter-btn {
margin-left: 4px;
padding: 5px 12px;
border: 1px solid #17333a;
border-radius: 4px;
background: linear-gradient(180deg, #10191c, #050a0c);
color: #c6edf4;
font: inherit;
font-size: 12px;
cursor: pointer;
box-shadow: 0 0 8px rgba(175, 239, 255, 0.3), 0 0 22px rgba(144, 228, 247, 0.2);
}

.enter-btn:active { transform: translateY(1px); }
.enter-btn:disabled { opacity: 0.45; cursor: default; }

.cursor {
display: inline-block;
width: 8px;
height: 15px;
margin-left: 3px;
background: #d4fbff;
vertical-align: -2px;
box-shadow: 0 0 8px #9deeff;
animation: blink 0.75s steps(1) infinite;
}

.progress {
display: inline-block;
letter-spacing: 0;
color: #9fe9ff;
}

/* stage 2 */
.equation {
display: block;
margin: 14px 0 6px;
text-align: center;
font-size: clamp(22px, 5.4vw, 34px);
letter-spacing: 0.12em;
color: #e6fbff;
text-shadow:
0 0 6px rgba(200, 245, 255, 0.9),
0 0 18px rgba(120, 200, 255, 0.55);
}

.equation-note {
display: block;
text-align: center;
font-size: 11px;
letter-spacing: 0.18em;
color: #6f959c;
}

.love {
display: block;
margin: 18px 0 8px;
text-align: center;
font-family: "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", sans-serif;
font-size: clamp(22px, 6vw, 38px);
font-weight: 700;
letter-spacing: 0.08em;
color: var(--love);
text-shadow:
0 0 6px rgba(255, 220, 238, 0.95),
0 0 18px rgba(255, 140, 200, 0.6),
0 0 40px rgba(160, 170, 255, 0.45);
}

.love .heart { display: inline-block; animation: heartbeat 1.1s ease-in-out infinite; }

/* 最後的提問 */
.ask {
display: block;
margin: 6px 0;
text-align: center;
font-family: "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", sans-serif;
font-size: clamp(16px, 4.2vw, 24px);
letter-spacing: 0.14em;
color: var(--love);
text-shadow: 0 0 6px rgba(255, 210, 235, 0.8), 0 0 16px rgba(255, 140, 200, 0.45);
animation: askIn 1.4s ease both;
}

.ask.you {
margin: 10px 0;
font-size: clamp(34px, 9vw, 58px);
font-weight: 700;
text-shadow:
0 0 8px rgba(255, 220, 238, 0.95),
0 0 24px rgba(255, 140, 200, 0.65),
0 0 52px rgba(160, 170, 255, 0.45);
animation: askIn 2.2s ease both;
}

.ask.q { font-weight: 700; }

.flood {
display: block;
margin: 8px 0 4px;
text-align: center;
font-size: clamp(14px, 3.6vw, 20px);
line-height: 1.25;
letter-spacing: 0.06em;
word-break: break-all;
white-space: normal;
color: #ffc2de;
text-shadow: 0 0 6px rgba(255, 150, 205, 0.75);
}

@keyframes askIn {
0% { opacity: 0; filter: blur(6px); transform: translateY(6px); }
100% { opacity: 1; filter: blur(0); transform: translateY(0); }
}

/* footer */
.footer { position: relative; z-index: 5; width: 100%; }

.footer-line {
height: 2px;
background: #b9f7ff;
box-shadow: 0 0 4px #c5fbff, 0 0 10px rgba(122, 224, 245, 0.9), 0 0 20px rgba(100, 214, 236, 0.55);
}

.warning-main {
display: flex;
min-height: 35px;
align-items: center;
justify-content: center;
padding: 7px 18px 2px;
background: #020405;
color: var(--danger);
font-size: 12px;
font-weight: 600;
text-align: center;
text-shadow: 0 0 8px rgba(226, 155, 155, 0.35);
}

.copyright {
padding: 3px 12px max(9px, env(safe-area-inset-bottom));
background: #020405;
color: #4e696f;
font-size: 9px;
line-height: 1.5;
text-align: center;
}

.flash {
position: absolute;
inset: 0;
z-index: 20;
background: rgba(186, 244, 255, 0.15);
opacity: 0;
pointer-events: none;
}

.flash.active { animation: screenFlash 0.24s ease-out; }
.flash.red { background: rgba(255, 140, 140, 0.13); }
.flash.pink { background: rgba(255, 190, 225, 0.18); }



/* ── 背景 MV（模糊）── */
.bgv {
position: absolute;
inset: 0;
z-index: 0;
overflow: hidden;
pointer-events: none;
opacity: 0;
transition: opacity 1.6s ease;
}

.bgv.ready { opacity: 1; }

.bgv-frame {
position: absolute;
top: 50%;
left: 50%;
width: max(100%, 177.78vh);
height: max(100%, 56.25vw);
transform: translate(-50%, -50%) scale(1.18);
filter: blur(9px) brightness(0.5) saturate(1.15);
}

.bgv-frame iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; display: block; opacity: 0; transition: opacity 1.2s ease; }
.bgv-frame iframe.on { opacity: 1; }

.bgv::after {
content: "";
position: absolute;
inset: 0;
background:
radial-gradient(ellipse at center, rgba(1, 2, 3, 0.15), rgba(1, 2, 3, 0.7) 85%),
rgba(1, 2, 3, 0.25);
}

.bgm {
position: absolute;
right: 12px;
bottom: 12px;
z-index: 40;
}

.bgm-chip {
display: flex;
align-items: center;
gap: 7px;
max-width: 64vw;
padding: 6px 11px;
border: 1px solid #17333a;
border-radius: 999px;
background: rgba(5, 12, 14, 0.85);
color: #7fa5ac;
font: inherit;
font-size: 11px;
letter-spacing: 0.04em;
cursor: pointer;
box-shadow: 0 0 10px rgba(144, 228, 247, 0.15);
white-space: nowrap;
}

.bgm-chip .note { display: inline-block; }
.bgm.on .bgm-chip { color: #ffd0e6; border-color: rgba(255, 190, 225, 0.35); box-shadow: 0 0 12px rgba(255, 160, 210, 0.25); }
.bgm.on .bgm-chip .note { animation: bob 1.2s ease-in-out infinite; }
.bgm-title { overflow: hidden; text-overflow: ellipsis; }

@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-2px); } }

/* animations */
@keyframes logoInOut {
0%   { opacity: 0; transform: scale(0.94); filter: blur(6px); }
30%  { opacity: 1; transform: scale(1);    filter: blur(0); }
65%  { opacity: 1; transform: scale(1.01); filter: blur(0); }
100% { opacity: 0; transform: scale(1.05); filter: blur(5px); }
}

@keyframes glowPulse {
0%, 100% { opacity: 0.7; transform: scale(0.96); }
50%      { opacity: 1;   transform: scale(1.05); }
}

@keyframes blink { 50% { opacity: 0; } }
@keyframes blinkSoft { 0%, 100% { opacity: 0.35; } 50% { opacity: 1; } }

@keyframes decodeFlicker {
0%   { opacity: 0.8;  text-shadow: 2px 0 rgba(133, 238, 255, 0.5), -2px 0 rgba(255, 255, 255, 0.15); }
50%  { opacity: 1;    text-shadow: -1px 0 rgba(133, 238, 255, 0.75), 1px 0 rgba(255, 255, 255, 0.25); }
100% { opacity: 0.9;  text-shadow: 1px 0 rgba(133, 238, 255, 0.5), -1px 0 rgba(255, 255, 255, 0.18); }
}

@keyframes screenFlash { 0% { opacity: 0; } 35% { opacity: 1; } 100% { opacity: 0; } }

@keyframes shake {
0%, 100% { transform: translateX(0); }
20% { transform: translateX(-6px); }
40% { transform: translateX(5px); }
60% { transform: translateX(-3px); }
80% { transform: translateX(2px); }
}

@keyframes heartbeat {
0%, 100% { transform: scale(1); }
25% { transform: scale(1.22); }
45% { transform: scale(0.98); }
60% { transform: scale(1.12); }
}

@media (max-width: 700px), (max-height: 700px) {
body { overflow-y: auto; }
.status, .counter, .credit { font-size: 9px; }
.status { top: 14px; left: 12px; max-width: calc(100% - 120px); }
.credit { top: 33px; left: 12px; }
.counter { top: 14px; right: 12px; }
.center { padding: 64px 10px 18px; }
.logo-wrap { width: 190px; height: 210px; }
.logo { width: 150px; }
.terminal { min-height: 220px; max-height: 66dvh; padding: 13px 14px 15px; font-size: 12.5px; line-height: 1.65; }
.warning-main { min-height: 32px; padding: 6px 12px 2px; font-size: 10px; }
.copyright { font-size: 8px; }
}

@media (prefers-reduced-motion: reduce) {
.terminal.decoding, .love .heart, .logo-glow, .ask { animation: none; }
}
</style>
</head>

const pattern = [0, 42, -26, 73, 15, -38, 55];
const tick = (step) => tone(620 + pattern[step % pattern.length], 0.03, 0, "square", 0.009);
const beep = () => { tone(900, 0.075, 0, "square", 0.03); tone(1180, 0.085, 0.1, "square", 0.026); };
const deny = () => { tone(220, 0.16, 0, "sawtooth", 0.035); tone(160, 0.22, 0.14, "sawtooth", 0.03); };
const success = () => { tone(520, 0.12, 0, "sine", 0.04); tone(690, 0.14, 0.09, "sine", 0.042); tone(920, 0.19, 0.2, "sine", 0.038); };
const chime = () => { [784, 988, 1175, 1568].forEach((f, i) => tone(f, 0.5, i * 0.13, "sine", 0.03)); };


/* ───────── 背景 MV（Bilibili 嵌入播放器，循環）─────────
 * 瀏覽器規定要「點一下」才能有聲音，所以在按下「點擊連線」的那一刻才載入播放器，每次進入都從 0 秒開始。
 * 循環：快播完時先在底下載入一個新的播放器，新的開始播之後再移除舊的，避免停頓和片尾推薦畫面。
 * 右下角 ♪：關掉＝移除播放器；再打開＝從頭重新播放。
 */
const BILI_SRC = "https://player.bilibili.com/player.html?bvid=BV16z4y1q7mc&p=1&page=1&t=0&autoplay=1&danmaku=0&high_quality=1&isOutside=true";
const SONG_SECONDS = 235;
const bgv = $("bgv");
const bgvFrame = bgv.querySelector(".bgv-frame");
const bgm = $("bgm");
const bgmChip = $("bgmChip");
const bgmTitle = $("bgmTitle");
let soundOn = false;
let loopTimer = null;

function setChip() {
bgm.classList.toggle("on", soundOn);
bgmTitle.textContent = soundOn ? "貴方の恋人になりたい" : "貴方の恋人になりたい ・ 點一下開聲音";
}

function spawnPlayer() {
const f = document.createElement("iframe");
// credentialless：不帶 B 站登入狀態和記錄，播放器不會「接續上次看到的位置」，每次都從 0 秒開始
f.setAttribute("credentialless", "");
f.src = BILI_SRC + "&_=" + Date.now();
f.allow = "autoplay; fullscreen; encrypted-media; picture-in-picture";
f.setAttribute("allowfullscreen", "");
f.setAttribute("scrolling", "no");
f.setAttribute("frameborder", "0");
f.title = "背景音樂";
f.addEventListener("load", () => {
clearTimeout(loopTimer);
// 從載入完成開始計時，快播完前 2 秒接上下一輪
loopTimer = setTimeout(() => { if (soundOn) spawnPlayer(); }, (SONG_SECONDS - 2) * 1000);
setTimeout(() => {
if (!f.isConnected) return;
f.classList.add("on");
bgv.classList.add("ready");
bgvFrame.querySelectorAll("iframe").forEach((x) => { if (x !== f) setTimeout(() => x.remove(), 1300); });
}, 1200);
}, { once: true });
bgvFrame.appendChild(f);
}

function turnSoundOn() {
turnSoundOff(true);
soundOn = true;
setChip();
spawnPlayer();
}

function turnSoundOff(silent) {
clearTimeout(loopTimer);
bgvFrame.querySelectorAll("iframe").forEach((x) => x.remove());
bgv.classList.remove("ready");
soundOn = false;
if (!silent) setChip();
}

let firstSound = true;
bgmChip.addEventListener("click", (e) => {
e.stopPropagation();
firstSound = false;
if (soundOn) turnSoundOff();
else turnSoundOn();
});

/* ───────── helpers ───────── */
function doFlash(kind = "") {
flash.className = "flash";
void flash.offsetWidth;
flash.className = "flash active " + kind;
}

function scrollDown() { terminal.scrollTop = terminal.scrollHeight; }

function addLine(text = "", cls = "") {
const el = document.createElement("span");
el.className = "line " + cls;
el.textContent = text;
log.appendChild(el);
scrollDown();
return el;
}

// 每一行先以亂碼出現，再由左到右解碼成正確文字
async function typeLine(text, cls = "") {
const el = addLine("", cls);
const chars = Array.from(text);
const frames = Math.max(14, Math.round(chars.length * 0.9));
const garble = (shown) => chars.map((c, i) => (i < shown || c === " " ? c : randomSymbol())).join("");
el.textContent = garble(0);
terminal.classList.add("decoding");
for (let f = 0; f <= frames; f++) {
const p = 1 - Math.pow(1 - f / frames, 1.8);
el.textContent = garble(Math.floor(p * chars.length));
if (f % 2 === 0) tick(f);
await wait(26 + Math.random() * 16);
}
terminal.classList.remove("decoding");
el.textContent = text;
scrollDown();
return el;
}

async function scrambleInto(el, text, frames = 40) {
const chars = Array.from(text);
terminal.classList.add("decoding");
for (let f = 0; f <= frames; f++) {
const p = 1 - Math.pow(1 - f / frames, 2.2);
const shown = Math.floor(p * chars.length);
el.textContent = chars.map((c, i) => (i < shown || c === " " ? c : randomSymbol())).join("");
if (f % 2 === 0) tick(f);
await wait(32 + Math.random() * 18);
}
terminal.classList.remove("decoding");
el.textContent = text;
}

/* ───────── crypto ───────── */
const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));

async function tryDecrypt(password) {
const enc = new TextEncoder();
const baseKey = await crypto.subtle.importKey("raw", enc.encode(password), "PBKDF2", false, ["deriveKey"]);
const key = await crypto.subtle.deriveKey(
{ name: "PBKDF2", salt: b64(PAYLOAD.salt), iterations: PAYLOAD.iter, hash: "SHA-256" },
baseKey,
{ name: "AES-GCM", length: 256 },
false,
["decrypt"]
);
const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(PAYLOAD.iv) }, key, b64(PAYLOAD.data));
return JSON.parse(new TextDecoder().decode(plain));
}

// 支援多種輸入：100610020308、10/06 10/02 03/08、10/6=10/2x3/8 …
function candidates(raw) {
const set = new Set();
const digits = raw.replace(/\D/g, "");
if (digits) set.add(digits);
const groups = raw.match(/\d+/g);
if (groups && groups.length > 1) set.add(groups.map((g) => g.padStart(2, "0")).join(""));
return [...set];
}

/* ───────── flow ───────── */
async function playIntro() {
logoWrap.classList.add("show");
setTimeout(() => tapHint.classList.add("show"), 900);
await new Promise((resolve) => {
const done = () => { clearTimeout(timer); resolve(); };
const timer = setTimeout(done, 4700);
skipIntro = done;
});
skipIntro = null;
tapHint.classList.remove("show");
intro.style.transition = "opacity 0.5s ease";
intro.style.opacity = "0";
await wait(500);
intro.remove();
}

screen.addEventListener("pointerdown", () => {
ensureAudio();
if (skipIntro) skipIntro();
}, { once: false });

function waitForGate() {
const gate = $("gate");
statusText.textContent = "LoveSuSu：等待連線...";
return new Promise((resolve) => {
gate.addEventListener("click", (e) => {
e.stopPropagation();
ensureAudio();
beep();
firstSound = false;
turnSoundOn(true); // 音樂從頭開始播放
gate.classList.add("gone");
setTimeout(() => gate.remove(), 400);
resolve();
}, { once: true });
});
}

async function boot() {
await waitForGate();
statusText.textContent = "LoveSuSu：連線中...";
await playIntro();
terminal.classList.add("visible");
statusText.textContent = "LoveSuSu：偵測到加密封包...";
await wait(350);

await typeLine("[BOOT]   LoveSuSu kernel v1.0.3 載入中...", "dim");
await typeLine("[SIGNAL] 偵測到加密封包：0x7375 (\"su\")");
await typeLine("[CIPHER] AES-256-GCM ／ PBKDF2-SHA256 × " + PAYLOAD.iter.toLocaleString());
await typeLine("[LOCK]   封包已鎖定，僅限指定接收者開啟。", "dim");
await typeLine("[AUTH]   請輸入通行密碼。");
addLine("");
showPrompt();
}

function showPrompt() {
const row = document.createElement("div");
row.className = "prompt-row";
row.innerHTML =
'<span class="prompt-label"><b>su@lovesusu</b>:~$ password:</span>' +
'<span class="pw-field"><input class="pw-input" id="pw" type="password" inputmode="numeric" ' +
'autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="go" aria-label="通行密碼"></span>' +
'<button class="enter-btn" id="enterBtn" type="button">ENTER</button>';
log.appendChild(row);
scrollDown();

const input = row.querySelector("#pw");
const btn = row.querySelector("#enterBtn");
input.addEventListener("keydown", (e) => {
ensureAudio();
if (e.key === "Enter") { e.preventDefault(); submit(input, btn, row); }
else tick(Math.floor(Math.random() * 7));
});
btn.addEventListener("click", () => submit(input, btn, row));
terminal.addEventListener("click", () => { if (!input.disabled) input.focus(); });
setTimeout(() => input.focus({ preventScroll: true }), 50);
statusText.textContent = "LoveSuSu：等待輸入密碼...";
}

async function submit(input, btn, row) {
if (busy) return;
const raw = input.value.trim();
if (!raw) { input.focus(); return; }
busy = true;
ensureAudio();
beep();
input.disabled = true;
btn.disabled = true;

// 把輸入列換成已輸入的樣子
row.remove();
addLine("su@lovesusu:~$ password: " + "•".repeat(Math.min(Array.from(raw).length, 24)), "dim");

const verify = addLine("[AUTH]   驗證中 ");
const spin = ["|", "/", "-", "\\"];
let s = 0;
const spinner = setInterval(() => { verify.textContent = "[AUTH]   驗證中 " + spin[s++ % 4]; }, 90);

let result = null;
const started = performance.now();
for (const pw of candidates(raw)) {
try { result = await tryDecrypt(pw); break; } catch (e) { /* wrong key */ }
}
const elapsed = performance.now() - started;
if (elapsed < 900) await wait(900 - elapsed);
clearInterval(spinner);

if (!result) {
failCount++;
verify.textContent = "[DENIED] 密碼錯誤：存取遭拒 (" + String(failCount).padStart(2, "0") + ")";
verify.className = "line bad";
deny();
doFlash("red");
terminal.classList.remove("shake");
void terminal.offsetWidth;
terminal.classList.add("shake");
counter.textContent = "0x7375 / DENIED";
if (failCount === 3) {
await typeLine("[HINT]   12 位數字：我們初次認識的那天 + 妳的生日 + 我的生日 (MMDD)", "hint");
}
addLine("");
busy = false;
showPrompt();
return;
}

verify.textContent = "[AUTH]   驗證成功，接收者身分確認。";
verify.className = "line ok";
success();
doFlash();
counter.textContent = "0x7375 / UNLOCKED";
statusText.textContent = "LoveSuSu：解密中...";
await reveal(result);
}

async function slowType(el, text, perChar, dotDelay) {
const chars = Array.from(text);
for (let i = 0; i < chars.length; i++) {
el.textContent += chars[i];
const isDot = chars[i] === "." || chars[i] === "…";
tone(isDot ? 420 : 620 + i * 25, 0.07, 0, "sine", 0.025);
scrollDown();
await wait(isDot ? dotDelay : perChar);
}
}

async function blankLines(n, gap) {
for (let i = 0; i < n; i++) {
addLine("");
scrollDown();
await wait(gap);
}
}

// ♡ 先一顆一顆，再越來越快淹滿畫面
async function heartFlood(slow, fillRatio, cap) {
const flood = document.createElement("span");
flood.className = "flood";
log.appendChild(flood);
for (let i = 0; i < slow; i++) {
flood.textContent += "♡";
tone(660 + i * 60, 0.12, 0, "sine", 0.035);
scrollDown();
await wait(480 - i * 50);
}
let per = 1;
let total = slow;
let frame = 0;
while (total < cap) {
const n = Math.min(per, cap - total);
flood.textContent += "♡".repeat(n);
total += n;
if (frame % 3 === 0) tone(700 + Math.random() * 500, 0.05, 0, "sine", 0.015);
scrollDown();
frame++;
if (per < 60) per = Math.ceil(per * 1.12);
if (flood.offsetHeight > terminal.clientHeight * fillRatio && total > 300) break;
await wait(frame < 25 ? 70 : 33);
}
}

async function askHer(ask) {
await wait(2600);

// 第一句
const a = document.createElement("span");
a.className = "ask";
log.appendChild(a);
await slowType(a, ask[0], 260, 420);
await wait(1400);

// 好幾行空白，慢慢往下捲
await blankLines(8, 260);
await wait(600);

// ♡♡♡ 淹滿
await heartFlood(4, 0.9, 1600);
await wait(1100);

// 第二句
const you = document.createElement("span");
you.className = "ask you";
log.appendChild(you);
await slowType(you, ask[1], 500, 520);
tone(392, 0.5, 0, "sine", 0.05);
await wait(1400);

addLine("");
await heartFlood(3, 0.55, 700);
await wait(1100);

// 第三句 + ♡
const q = document.createElement("span");
q.className = "ask q";
log.appendChild(q);
await slowType(q, ask[2], 300, 450);
statusText.textContent = "LoveSuSu：等待妳的回覆...";
counter.textContent = "0x7375 / WAITING ♡";
await wait(1000);
await heartFlood(5, 0.72, 4000);

chime();
doFlash("pink");
await wait(900);
}

async function reveal(data) {
await wait(300);
// 解密進度條
const bar = addLine("", "");
const width = 22;
terminal.classList.add("decoding");
for (let i = 0; i <= width; i++) {
const pct = String(Math.round((i / width) * 100)).padStart(3, " ");
bar.textContent = "[DECRYPT] [" + "█".repeat(i) + "░".repeat(width - i) + "] " + pct + "%";
tick(i);
await wait(55 + Math.random() * 45);
}
terminal.classList.remove("decoding");
await typeLine("[DECRYPT] 第一層解密完成。", "ok");
await wait(400);

// 第二段
addLine("");
await typeLine("──────────── STAGE 02 ────────────", "dim");
const eq = document.createElement("span");
eq.className = "equation";
log.appendChild(eq);
scrollDown();
await scrambleInto(eq, data.eq, 46);
success();
doFlash();
await wait(250);
const note = document.createElement("span");
note.className = "equation-note";
log.appendChild(note);
for (const c of Array.from(data.note)) { note.textContent += c; tick(1); await wait(45); }
scrollDown();
await wait(1100);

// 最終訊息
addLine("");
await typeLine("[MESSAGE] 正在輸出最終訊息...", "dim");
await wait(600);
const love = document.createElement("span");
love.className = "love";
log.appendChild(love);
const chars = Array.from(data.msg);
for (let i = 0; i < chars.length; i++) {
const c = chars[i];
if (c === "♡") {
const h = document.createElement("span");
h.className = "heart";
h.textContent = c;
love.appendChild(h);
} else {
love.appendChild(document.createTextNode(c));
}
tone(560 + i * 38, 0.09, 0, "sine", 0.03);
scrollDown();
await wait(i < 3 ? 380 : 230);
}
chime();
doFlash("pink");
statusText.textContent = "LoveSuSu：訊息已送達 ♡";
counter.textContent = "0x7375 / DELIVERED";

// 最後的提問（文字在加密內容裡）
if (Array.isArray(data.ask) && data.ask.length === 3) await askHer(data.ask);

await wait(700);
const end = addLine("", "dim");
end.textContent = "su@lovesusu:~$ ";
const cur = document.createElement("span");
cur.className = "cursor";
end.appendChild(cur);
scrollDown();
}

boot();
